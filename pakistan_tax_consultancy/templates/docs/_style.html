<style>
  .ptc { font-family: Helvetica, Arial, sans-serif; font-size: 11.5px; line-height: 1.6; color: #1f2937; }
  .ptc h1 { font-family: Georgia, "Times New Roman", serif; font-size: 21px; color: #141416; margin: 0 0 2px; font-weight: bold; }
  .ptc h2 { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #8a6914; margin: 22px 0 6px; font-weight: bold; }
  .ptc .eyebrow { font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: #8a6914; font-weight: bold; }
  .ptc .muted { color: #6b7280; }
  .ptc .meta { width: 100%; border-collapse: collapse; margin: 14px 0 4px; background: #faf7ee; }
  .ptc .meta td { padding: 7px 10px; border: 1px solid #efe6c8; font-size: 10.5px; vertical-align: top; }
  .ptc .meta .k { color: #6b7280; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; display: block; }
  .ptc table.grid { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .ptc table.grid th { background: #141416; color: #f3d77a; font-size: 9.5px; text-transform: uppercase; letter-spacing: 1px; text-align: left; padding: 6px 8px; }
  .ptc table.grid td { padding: 6px 8px; border-bottom: 1px solid #e5e7eb; }
  .ptc table.grid .num, .ptc table.grid th.num { text-align: right; white-space: nowrap; }
  .ptc table.grid tr.total td { font-weight: bold; border-top: 2px solid #141416; border-bottom: 0; background: #faf7ee; }
  .ptc .result { margin-top: 14px; padding: 12px 14px; border: 1.5px solid #d4af37; background: #fffaf0; }
  .ptc .result .big { font-family: Georgia, serif; font-size: 20px; font-weight: bold; color: #141416; }
  .ptc .note { margin-top: 16px; padding: 9px 12px; border-left: 3px solid #d4af37; background: #f9fafb; font-size: 10px; color: #4b5563; }
  .ptc .draft { margin: 0 0 12px; padding: 6px 10px; background: #fef3c7; border: 1px solid #f59e0b; color: #92400e; font-size: 10px; font-weight: bold; text-align: center; letter-spacing: 1px; }
  .ptc .sign { margin-top: 38px; width: 100%; border-collapse: collapse; }
  .ptc .sign td { width: 50%; vertical-align: bottom; padding-right: 30px; }
  .ptc .line { border-top: 1px solid #141416; padding-top: 4px; font-size: 10px; }
  .ptc .tick { color: #047857; font-weight: bold; }
  .ptc .cross { color: #b45309; font-weight: bold; }
  .ptc ol, .ptc ul { margin: 4px 0 0 18px; padding: 0; }
  .ptc li { margin: 2px 0; }
</style>
{% if letter_head and not no_letterhead %}<div style="margin-bottom:18px;">{{ letter_head }}</div>{% endif %}
{% if footer and not no_letterhead %}<div id="footer-html" class="visible-pdf">{{ footer }}</div>{% endif %}
