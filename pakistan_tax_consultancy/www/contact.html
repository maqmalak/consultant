{% extends "templates/ptc/base.html" %}
{% block content %}
<section class="mx-auto max-w-6xl px-4 py-14">
  {% include "templates/ptc/contact_block.html" %}
  <form id="contact-form" class="form-card mt-12 max-w-2xl" novalidate>
    <div class="form-card-head">{{ _("Send us a message") }}</div>
    <div class="form-card-body grid gap-4 sm:grid-cols-2">
      <label class="block text-sm font-semibold sm:col-span-2">{{ _("Full name") }} *<input name="full_name" required class="field mt-1.5" autocomplete="name" /></label>
      <label class="block text-sm font-semibold">{{ _("Mobile") }}<input name="mobile" type="tel" class="field mt-1.5" autocomplete="tel" /></label>
      <label class="block text-sm font-semibold">{{ _("Email") }}<input name="email" type="email" class="field mt-1.5" autocomplete="email" /></label>
      <label class="block text-sm font-semibold sm:col-span-2">{{ _("Message") }} *<textarea name="message" rows="4" required maxlength="2000" class="field mt-1.5 h-auto"></textarea></label>
      <p id="contact-msg" role="status" class="text-sm sm:col-span-2"></p>
      <button type="submit" class="rounded-lg bg-primary px-5 py-3 font-semibold text-primary-foreground hover:bg-primary/90 sm:col-span-2">{{ _("Send") }}</button>
    </div>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script>
  (function () {
    var f = document.getElementById("contact-form"), msg = document.getElementById("contact-msg");
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var data = Object.fromEntries(new FormData(f).entries());
      ptcPost("pakistan_tax_consultancy.api.public.contact", data).then(function (r) {
        msg.className = "rounded-md bg-success/10 p-3 text-sm sm:col-span-2"; msg.textContent = r.message; f.reset();
      }).catch(function (x) { msg.className = "text-sm text-destructive sm:col-span-2"; msg.textContent = x.message; });
    });
  })();
</script>
{% endblock %}
